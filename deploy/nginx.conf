# =============================================================================
#  پیکربندی Nginx برای آکادمی HSE
#  ---------------------------------------------------------------------------
#  نصب:
#     sudo cp deploy/nginx.conf /etc/nginx/sites-available/hse
#     sudo ln -s /etc/nginx/sites-available/hse /etc/nginx/sites-enabled/hse
#     sudo rm -f /etc/nginx/sites-enabled/default
#     sudo nginx -t && sudo systemctl reload nginx
#
#  پیش از نصب، سه چیز را عوض کنید:
#     ۱. hse.example.ir  →  دامنه واقعی شما
#     ۲. /srv/hse        →  مسیر نصب پروژه روی سرور
#     ۳. گواهی SSL       →  با certbot ساخته می‌شود (راهنما: docs/deployment.md)
# =============================================================================

upstream hse_app {
    # Gunicorn روی Unix Socket گوش می‌دهد، نه پورت TCP: سریع‌تر است و از
    # بیرون سرور اصلاً قابل دسترسی نیست.
    server unix:/run/hse/gunicorn.sock fail_timeout=0;
}

# --- HTTP: فقط برای هدایت به HTTPS و تمدید گواهی ---
server {
    listen 80;
    listen [::]:80;
    server_name hse.example.ir www.hse.example.ir;

    # certbot برای تمدید خودکار گواهی به این مسیر نیاز دارد؛ اگر آن را هم
    # به HTTPS هدایت کنیم، تمدید در اولین دور شکست می‌خورد.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hse.example.ir www.hse.example.ir;

    # --- گواهی SSL (certbot این مسیرها را می‌سازد) ---
    ssl_certificate     /etc/letsencrypt/live/hse.example.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hse.example.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # نسخه Nginx در هدر پاسخ اعلام نشود.
    server_tokens off;

    # آپلود ویدیوی دوره از پنل مدیریت. پیش‌فرض Nginx یک مگابایت است و
    # آپلود ویدیو با خطای 413 رد می‌شود.
    client_max_body_size 2048M;
    client_body_timeout 300s;

    # فشرده‌سازی متن. تصویر و ویدیو از قبل فشرده‌اند و دوباره فشرده
    # کردنشان فقط CPU مصرف می‌کند.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/hse-access.log;
    error_log  /var/log/nginx/hse-error.log;

    # -------------------------------------------------------------------------
    # فایل‌های ثابت — مستقیم از دیسک، بدون بیدار کردن پایتون
    # -------------------------------------------------------------------------
    location /static/ {
        alias /srv/hse/staticfiles/;
        # نام فایل‌های ثابت شامل هش محتواست (ManifestStaticFilesStorage)، پس
        # کش طولانی بی‌خطر است: تغییر فایل یعنی تغییر نام.
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /media/ {
        alias /srv/hse/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # -------------------------------------------------------------------------
    # فایل‌های محافظت‌شده دوره‌ها (ویدیو و جزوه)
    # -------------------------------------------------------------------------
    # `internal` یعنی این مسیر مستقیماً از بیرون قابل صدا زدن نیست. فقط وقتی
    # کار می‌کند که Django هدر X-Accel-Redirect بفرستد — یعنی بعد از اینکه
    # ثبت‌نام کاربر را بررسی کرده است.
    #
    # مسیر این بلوک باید دقیقاً با X_ACCEL_REDIRECT_PREFIX در .env یکی باشد.
    # سود اصلی‌اش این است که ارسال یک ویدیوی نیم‌ساعته را Nginx انجام
    # می‌دهد و Worker پایتون بلافاصله آزاد می‌شود.
    location /protected-internal/ {
        internal;
        alias /srv/hse/protected_media/;
    }

    # -------------------------------------------------------------------------
    # بقیه درخواست‌ها → Gunicorn
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://hse_app;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # مهم: هدر را **بازنویسی** می‌کنیم، نه اینکه به زنجیره قبلی اضافه
        # کنیم. اگر $proxy_add_x_forwarded_for بگذاریم، مقدار ساختگیِ خودِ
        # کاربر هم داخلش می‌ماند و سقف‌های محدودسازی نرخ (فاز ۲۱) با یک
        # هدر دستی دور زده می‌شوند.
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_redirect off;

        # ساخت PDF گواهی و آپلود فایل ممکن است چند ثانیه طول بکشد.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # آدرس سلامت برای مانیتورینگ؛ در لاگ دسترسی ثبت نمی‌شود تا لاگ را
    # شلوغ نکند.
    location = /health/ {
        proxy_pass http://hse_app;
        proxy_set_header Host $host;
        access_log off;
    }

    # فایل‌های پنهان (مثل .env یا .git) هیچ‌وقت نباید سرو شوند.
    location ~ /\. {
        deny all;
    }
}
