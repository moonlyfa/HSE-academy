{# نوار مراحل — به کاربر نشان می‌دهد کجای جریان ثبت‌نام است #}
<ol class="step-bar" aria-label="مراحل ثبت‌نام">
    <li class="step-bar__item {% if step >= 1 %}is-done{% endif %} {% if step == 1 %}is-active{% endif %}">
        <span class="step-bar__num">۱</span>
        <span class="step-bar__label">شماره موبایل</span>
    </li>
    <li class="step-bar__item {% if step >= 2 %}is-done{% endif %} {% if step == 2 %}is-active{% endif %}">
        <span class="step-bar__num">۲</span>
        <span class="step-bar__label">کد تأیید</span>
    </li>
    <li class="step-bar__item {% if step >= 3 %}is-done{% endif %} {% if step == 3 %}is-active{% endif %}">
        <span class="step-bar__num">۳</span>
        <span class="step-bar__label">احراز هویت</span>
    </li>
    <li class="step-bar__item {% if step >= 4 %}is-done{% endif %} {% if step == 4 %}is-active{% endif %}">
        <span class="step-bar__num">۴</span>
        <span class="step-bar__label">اطلاعات حساب</span>
    </li>
</ol>
